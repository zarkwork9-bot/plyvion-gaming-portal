<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Neon Dodger</title><style>*{box-sizing:border-box}body{margin:0;background:#090d20;color:#fff;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.wrap{width:min(94vw,520px);text-align:center}.top{display:flex;justify-content:space-between;margin:10px 4px;color:#9ff}.stage{position:relative;background:linear-gradient(#111b3a,#080d20);border:2px solid #35e8ff;border-radius:18px;overflow:hidden;box-shadow:0 0 25px #00cfff55}canvas{display:block;width:100%;height:auto;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-content:center;background:#05091dcc;gap:12px}.overlay.hidden{display:none}button{border:0;border-radius:12px;padding:13px 20px;background:#31e6ff;color:#061020;font-weight:800;font-size:16px}.controls{display:flex;gap:14px;margin-top:12px}.controls button{flex:1;background:#192b55;color:white;border:1px solid #36dfff}.hint{color:#9eadd4;font-size:13px}</style></head><body><main class="wrap"><h1>⚡ Neon Dodger</h1><div class="top"><span>Score: <b id="score">0</b></span><span>Best: <b id="best">0</b></span></div><div class="stage"><canvas id="c" width="480" height="640"></canvas><div class="overlay" id="over"><h2 id="msg">Ready?</h2><button id="start">Start Game</button></div></div><div class="controls"><button id="left">◀ LEFT</button><button id="right">RIGHT ▶</button></div><p class="hint">Move with arrow keys / A-D or touch controls. Avoid the glowing blocks!</p></main><script>const c=document.querySelector('#c'),x=c.getContext('2d'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),over=document.querySelector('#over');let p=240,blocks=[],score=0,alive=false,keys={},last=0,spawn=0;let best=+(localStorage.ndBest||0);bestEl.textContent=best;function draw(){x.clearRect(0,0,480,640);x.strokeStyle='#20345c';for(let i=0;i<480;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i,640);x.stroke()}x.shadowBlur=18;x.shadowColor='#4ff';x.fillStyle='#4ff';x.fillRect(p-18,565,36,36);x.shadowBlur=0;blocks.forEach(b=>{x.shadowBlur=14;x.shadowColor='#ff3e9d';x.fillStyle='#ff3e9d';x.fillRect(b.x,b.y,b.w,b.h)});x.shadowBlur=0}function end(){alive=false;best=Math.max(best,score);localStorage.ndBest=best;bestEl.textContent=best;document.querySelector('#msg').textContent='Game Over · Score '+score;document.querySelector('#start').textContent='Play Again';over.classList.remove('hidden')}function loop(t){if(!alive)return;let dt=Math.min((t-last)/16,2);last=t;if(keys.ArrowLeft||keys.a||keys.A)p-=6*dt;if(keys.ArrowRight||keys.d||keys.D)p+=6*dt;p=Math.max(18,Math.min(462,p));spawn+=dt;if(spawn>Math.max(14,34-score/8)){blocks.push({x:Math.random()*430,y:-35,w:25+Math.random()*35,h:24+Math.random()*28,s:3+Math.random()*2+score/160});spawn=0}blocks.forEach(b=>b.y+=b.s*dt);blocks=blocks.filter(b=>b.y<670);for(const b of blocks){if(p+17>b.x&&p-17<b.x+b.w&&582>b.y&&565<b.y+b.h){end();break}}score++;scoreEl.textContent=Math.floor(score/6);draw();if(alive)requestAnimationFrame(loop)}function start(){p=240;blocks=[];score=0;spawn=0;scoreEl.textContent=0;alive=true;over.classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}document.querySelector('#start').onclick=start;onkeydown=e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()};onkeyup=e=>keys[e.key]=false;[['left','ArrowLeft'],['right','ArrowRight']].forEach(([id,k])=>{let b=document.getElementById(id);b.onpointerdown=()=>keys[k]=true;b.onpointerup=b.onpointerleave=b.onpointercancel=()=>keys[k]=false});draw();</script></body></html>
