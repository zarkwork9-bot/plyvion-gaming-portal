<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111827"><title>Number Merge 2048</title>
<style>
:root{color-scheme:dark;--bg:#111827;--panel:#1f2937;--muted:#9ca3af;--accent:#f59e0b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#263449,var(--bg) 65%);color:#f9fafb;font:16px system-ui,sans-serif;display:flex;justify-content:center;padding:18px 12px}
main{width:min(100%,480px)}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:clamp(27px,7vw,40px);margin:8px 0}p{color:var(--muted);margin:4px 0 14px}.scores{display:flex;gap:8px}.score{background:var(--panel);border:1px solid #374151;border-radius:12px;padding:8px 13px;text-align:center;min-width:75px}.score small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px}.score strong{font-size:21px}.toolbar{display:flex;gap:8px;margin:12px 0}.btn{border:0;border-radius:10px;padding:11px 14px;background:#374151;color:white;font-weight:700;cursor:pointer}.btn.primary{background:var(--accent);color:#111827}.board-wrap{position:relative;background:#374151;padding:9px;border-radius:15px;box-shadow:0 18px 45px #0006;touch-action:none}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;aspect-ratio:1}.cell{border-radius:9px;background:#4b5563;display:grid;place-items:center;font-size:clamp(22px,7vw,34px);font-weight:800;transition:background .1s}.cell[data-v="2"]{background:#eee4da;color:#776e65}.cell[data-v="4"]{background:#ede0c8;color:#776e65}.cell[data-v="8"]{background:#f2b179;color:#fff}.cell[data-v="16"]{background:#f59563;color:#fff}.cell[data-v="32"]{background:#f67c5f;color:#fff}.cell[data-v="64"]{background:#f65e3b;color:#fff}.cell[data-v="128"]{background:#edcf72;color:#fff;font-size:clamp(18px,6vw,29px)}.cell[data-v="256"],.cell[data-v="512"]{background:#edc850;color:#fff;font-size:clamp(18px,6vw,29px)}.cell[data-v="1024"],.cell[data-v="2048"]{background:#edc22e;color:#fff;font-size:clamp(16px,5vw,26px)}.overlay{position:absolute;inset:9px;background:#111827dc;border-radius:10px;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}.overlay.show{display:flex}.overlay h2{font-size:34px;margin:0 0 8px}.help{font-size:13px;line-height:1.6;margin:14px 2px;color:#cbd5e1}.mobile-controls{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,46px);gap:5px;justify-content:center;margin:12px auto}.mobile-controls button{background:#374151;color:white;border:0;border-radius:9px;font-size:20px;font-weight:bold}.mobile-controls .up{grid-column:2}.mobile-controls .left{grid-column:1;grid-row:2}.mobile-controls .down{grid-column:2;grid-row:2}.mobile-controls .right{grid-column:3;grid-row:2}@media(min-width:650px){.mobile-controls{display:none}}
</style></head>
<body><main>
<header><div><h1>2048</h1><p>Merge the numbers. Reach 2048!</p></div><div class="scores"><div class="score"><small>Score</small><strong id="score">0</strong></div><div class="score"><small>Best</small><strong id="best">0</strong></div></div></header>
<div class="toolbar"><button class="btn primary" id="new">New Game</button><button class="btn" id="undo">Undo</button></div>
<section class="board-wrap" aria-label="2048 game board"><div class="board" id="board"></div><div class="overlay" id="overlay"><h2 id="message">Game Over</h2><p id="submessage">Try again!</p><button class="btn primary" id="again">Play Again</button></div></section>
<div class="mobile-controls" aria-label="Touch controls"><button class="up" data-dir="up">↑</button><button class="left" data-dir="left">←</button><button class="down" data-dir="down">↓</button><button class="right" data-dir="right">→</button></div>
<p class="help">Controls: use <b>Arrow keys</b> or <b>W A S D</b> to move tiles. On phones, swipe or tap the arrows. Matching tiles merge into one. Your best score is saved on this device only.</p>
</main>
<script>
(()=>{const N=4;let grid,score=0,best=0,won=false,over=false,previous=null;const board=document.getElementById('board'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),overlay=document.getElementById('overlay');
try{best=Number(localStorage.getItem('plyvion-2048-best'))||0}catch(e){}
const copy=()=>({grid:grid.map(r=>r.slice()),score,won,over});
function save(){try{localStorage.setItem('plyvion-2048-best',String(best))}catch(e){}}
function empty(){const a=[];grid.forEach((r,y)=>r.forEach((v,x)=>{if(!v)a.push([y,x])}));return a}
function spawn(){const a=empty();if(!a.length)return;const [y,x]=a[Math.floor(Math.random()*a.length)];grid[y][x]=Math.random()<.9?2:4}
function start(){grid=Array.from({length:N},()=>Array(N).fill(0));score=0;won=false;over=false;previous=null;spawn();spawn();render()}
function render(){board.innerHTML='';grid.flat().forEach(v=>{const c=document.createElement('div');c.className='cell';c.dataset.v=v||'';c.textContent=v||'';board.appendChild(c)});scoreEl.textContent=score;bestEl.textContent=best;overlay.classList.toggle('show',over||(won&&!sessionStorage.getItem('plyvion-2048-continued')));if(won&&!over){document.getElementById('message').textContent='You reached 2048!';document.getElementById('submessage').textContent='Amazing! Keep playing for a higher score.'}else if(over){document.getElementById('message').textContent='Game Over';document.getElementById('submessage').textContent='No more moves. Try again!'}}
function slide(line){let a=line.filter(Boolean),gain=0;for(let i=0;i<a.length-1;i++){if(a[i]===a[i+1]){a[i]*=2;gain+=a[i];a.splice(i+1,1)}}while(a.length<N)a.push(0);return {a,gain}}
function move(dir){if(over||(won&&!sessionStorage.getItem('plyvion-2048-continued')))return;const before=copy();let changed=false,gain=0;for(let i=0;i<N;i++){let line=[];for(let j=0;j<N;j++)line.push(dir==='left'||dir==='right'?grid[i][j]:grid[j][i]);if(dir==='right'||dir==='down')line.reverse();const result=slide(line);if(dir==='right'||dir==='down')result.a.reverse();gain+=result.gain;for(let j=0;j<N;j++){const y=dir==='left'||dir==='right'?i:j,x=dir==='left'||dir==='right'?j:i;if(grid[y][x]!==result.a[j])changed=true;grid[y][x]=result.a[j]}}if(!changed)return;previous=before;score+=gain;if(score>best){best=score;save()}spawn();if(!won&&grid.some(r=>r.includes(2048)))won=true;over=!empty().length&&!canMove();render()}
function canMove(){for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(!grid[y][x])return true;if(x<N-1&&grid[y][x]===grid[y][x+1])return true;if(y<N-1&&grid[y][x]===grid[y+1][x])return true}return false}
function undo(){if(!previous)return;grid=previous.grid;score=previous.score;won=previous.won;over=previous.over;previous=null;render()}
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase(),map={arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'};if(map[k]){e.preventDefault();move(map[k])}});
document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>move(b.dataset.dir)));
document.getElementById('new').onclick=start;document.getElementById('again').onclick=start;document.getElementById('undo').onclick=undo;
let sx=0,sy=0;board.parentElement.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});board.parentElement.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))},{passive:true});
document.getElementById('overlay').addEventListener('click',e=>{if(e.target===overlay&&won&&!over){sessionStorage.setItem('plyvion-2048-continued','1');overlay.classList.remove('show')}});
start();
})();
</script></body></html>
