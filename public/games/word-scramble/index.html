<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Scramble</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#fef3c7,#ffedd5);font:16px system-ui;color:#7c2d12}.app{width:min(92vw,470px);padding:24px;text-align:center;background:#fffaf0;border:2px solid #fdba74;border-radius:24px;box-shadow:0 15px 35px #9a341233}.word{font-size:clamp(32px,10vw,52px);letter-spacing:8px;font-weight:900;color:#ea580c;margin:24px 0}.hint{color:#9a3412;min-height:26px}.input{width:100%;padding:15px;border:2px solid #fdba74;border-radius:12px;font-size:20px;text-align:center;text-transform:lowercase}.buttons{display:flex;gap:10px;margin-top:12px}.buttons button{flex:1;padding:13px;border:0;border-radius:12px;background:#ea580c;color:white;font-weight:800}.buttons .alt{background:#fed7aa;color:#7c2d12}.msg{min-height:30px;font-weight:700}.stats{display:flex;justify-content:space-around;color:#9a3412}</style></head><body><main class="app"><h1>🔤 Word Scramble</h1><div class="stats"><span>Score: <b id="score">0</b></span><span>Round: <b id="round">1</b></span></div><div class="word" id="scrambled"></div><p class="hint" id="hint">Unscramble the letters!</p><input class="input" id="answer" placeholder="Type your answer" autocomplete="off"><div class="buttons"><button id="check">Check</button><button class="alt" id="hintBtn">Hint</button><button class="alt" id="skip">Skip</button></div><p class="msg" id="msg"></p></main><script>const words=[['planet','A world that orbits a star'],['garden','A place where flowers grow'],['rocket','A vehicle that travels into space'],['puzzle','A game that tests your thinking'],['orange','A citrus fruit and a colour'],['bridge','A structure built over a river'],['monkey','An animal that climbs trees'],['silver','A shiny grey precious metal'],['window','You look through it to see outside'],['castle','A large fortified building']];let index=0,score=0,round=1,current='';function scramble(w){let s=w.split('');do{s.sort(()=>Math.random()-.5)}while(s.join('')===w);return s.join('').toUpperCase()}function next(){index=Math.floor(Math.random()*words.length);current=words[index][0];document.querySelector('#scrambled').textContent=scramble(current);document.querySelector('#hint').textContent='Unscramble the letters!';document.querySelector('#answer').value='';document.querySelector('#msg').textContent='';document.querySelector('#round').textContent=round;document.querySelector('#answer').focus()}function check(){let a=document.querySelector('#answer').value.trim().toLowerCase(),m=document.querySelector('#msg');if(a===current){score+=10;round++;document.querySelector('#score').textContent=score;m.textContent='✅ Correct! +10 points';setTimeout(next,650)}else{m.textContent='Not quite — try again!'}}document.querySelector('#check').onclick=check;document.querySelector('#answer').onkeydown=e=>{if(e.key==='Enter')check()};document.querySelector('#hintBtn').onclick=()=>document.querySelector('#hint').textContent=words[index][1];document.querySelector('#skip').onclick=()=>{round++;next()};next();</script></body></html>
