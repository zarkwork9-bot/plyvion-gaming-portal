<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lane Rush</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:white;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.app{width:min(94vw,440px);text-align:center}.bar{display:flex;justify-content:space-around}.road{position:relative;margin:12px auto;background:#303b4d;width:100%;max-width:360px;height:560px;overflow:hidden;border:7px solid #64748b;border-radius:20px}.line{position:absolute;top:-40px;bottom:-40px;width:6px;background:repeating-linear-gradient(to bottom,#fff 0 35px,transparent 35px 70px);animation:move .5s linear infinite}.l1{left:33%}.l2{left:66%}@keyframes move{to{background-position:0 70px}}.car{position:absolute;width:54px;height:82px;border-radius:13px;box-shadow:inset 0 -12px #0003}.player{bottom:24px;background:#22d3ee}.enemy{background:#fb7185}.controls{display:flex;gap:12px;max-width:360px;margin:auto}.controls button{flex:1;padding:14px;border:0;border-radius:12px;background:#2563eb;color:white;font-weight:800;font-size:18px}.cover{position:absolute;inset:0;background:#0b1225dd;display:grid;place-content:center;gap:12px}.cover button{padding:13px;border:0;border-radius:10px;background:#22d3ee;font-weight:800}.hide{display:none}.tip{color:#a5b4fc;font-size:13px}</style></head><body><main class="app"><h1>🏁 Lane Rush</h1><div class="bar"><span>Distance: <b id="score">0</b> m</span><span>Best: <b id="best">0</b> m</span></div><div class="road" id="road"><i class="line l1"></i><i class="line l2"></i><div class="car player" id="player"></div><div class="cover" id="cover"><h2 id="label">Ready to race?</h2><button id="go">Start Race</button></div></div><div class="controls"><button id="left">◀</button><button id="right">▶</button></div><p class="tip">Switch lanes. Don't hit the traffic!</p></main><script>const road=document.querySelector('#road'),player=document.querySelector('#player'),cover=document.querySelector('#cover');let lane=1,traffic=[],running=false,score=0,last=0,spawn=0,best=+(localStorage.lrBest||0);document.querySelector('#best').textContent=best;function pos(el,l){el.style.left=(l*33+16.5)+'%';el.style.transform='translateX(-50%)'}function move(d){if(running){lane=Math.max(0,Math.min(2,lane+d));pos(player,lane)}}function finish(){running=false;best=Math.max(best,score);localStorage.lrBest=best;document.querySelector('#best').textContent=best;document.querySelector('#label').textContent='Crash! '+score+' m';document.querySelector('#go').textContent='Race Again';cover.classList.remove('hide')}function loop(t){if(!running)return;let dt=Math.min((t-last)/16,2);last=t;score+=dt*.45;document.querySelector('#score').textContent=Math.floor(score);spawn+=dt;if(spawn>45){let l=Math.floor(Math.random()*3),e=document.createElement('div');e.className='car enemy';pos(e,l);e.style.top='-95px';road.append(e);traffic.push({el:e,l,y:-95});spawn=0}traffic.forEach(o=>{o.y+=(4+score/250)*dt;o.el.style.top=o.y+'px';if(o.l===lane&&o.y>430&&o.y<535)finish()});traffic=traffic.filter(o=>{if(o.y>580){o.el.remove();return false}return true});if(running)requestAnimationFrame(loop)}function start(){traffic.forEach(o=>o.el.remove());traffic=[];lane=1;pos(player,lane);score=0;spawn=0;running=true;cover.classList.add('hide');last=performance.now();requestAnimationFrame(loop)}document.querySelector('#go').onclick=start;document.querySelector('#left').onclick=()=>move(-1);document.querySelector('#right').onclick=()=>move(1);onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1)};pos(player,lane);</script></body></html>
