<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Flip</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#172554,#581c87);font:16px system-ui;color:#fff;display:grid;place-items:center}.app{width:min(94vw,520px);text-align:center;padding:18px}.stats{display:flex;justify-content:space-around;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{aspect-ratio:1;border:0;border-radius:15px;background:#a78bfa;color:white;font-size:clamp(25px,8vw,42px);box-shadow:0 5px 0 #6d28d9;cursor:pointer}.card.open,.card.done{background:#fff;color:#312e81;box-shadow:0 5px 0 #c4b5fd}.card.done{opacity:.55}.action{margin:20px;padding:12px 22px;border:0;border-radius:12px;background:#facc15;color:#312e81;font-weight:800;font-size:16px}.note{color:#ddd6fe}</style></head><body><main class="app"><h1>🧠 Memory Flip</h1><p class="note">Find all matching pairs!</p><div class="stats"><span>Moves: <b id="moves">0</b></span><span>Pairs: <b id="pairs">0/8</b></span></div><div class="grid" id="grid"></div><h2 id="status"></h2><button class="action" id="reset">Shuffle & Restart</button></main><script>const icons=['🍉','🚀','🐼','🎸','🌈','🍕','🦊','⚽'];let deck=[],first=null,lock=false,moves=0,pairs=0;const grid=document.querySelector('#grid');function shuffle(){deck=[...icons,...icons].sort(()=>Math.random()-.5);first=null;lock=false;moves=0;pairs=0;document.querySelector('#moves').textContent=0;document.querySelector('#pairs').textContent='0/8';document.querySelector('#status').textContent='';grid.innerHTML='';deck.forEach((v,i)=>{let b=document.createElement('button');b.className='card';b.textContent='?';b.setAttribute('aria-label','Hidden card');b.onclick=()=>flip(b,v);grid.append(b)})}function flip(b,v){if(lock||b.classList.contains('open')||b.classList.contains('done'))return;b.textContent=v;b.classList.add('open');if(!first){first={b,v};return}moves++;document.querySelector('#moves').textContent=moves;if(first.v===v){first.b.classList.replace('open','done');b.classList.replace('open','done');pairs++;document.querySelector('#pairs').textContent=pairs+'/8';first=null;if(pairs===8)document.querySelector('#status').textContent='🎉 You matched them all in '+moves+' moves!'}else{lock=true;let prev=first.b;first=null;setTimeout(()=>{prev.textContent='?';b.textContent='?';prev.classList.remove('open');b.classList.remove('open');lock=false},750)}}document.querySelector('#reset').onclick=shuffle;shuffle();</script></body></html>
