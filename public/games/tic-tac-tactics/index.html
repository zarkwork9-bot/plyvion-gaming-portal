<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tic Tac Tactics</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eff6ff;color:#172554;font:16px system-ui}.app{width:min(92vw,430px);text-align:center;padding:20px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:22px auto}.cell{aspect-ratio:1;border:0;border-radius:16px;background:#dbeafe;color:#1d4ed8;font-size:clamp(45px,15vw,76px);font-weight:900;box-shadow:0 5px 0 #93c5fd}.cell.o{color:#ea580c}.actions{display:flex;gap:10px}.actions button{flex:1;padding:13px;border:0;border-radius:12px;background:#1d4ed8;color:white;font-weight:800}.status{min-height:30px;font-weight:700}</style></head><body><main class="app"><h1>❎ Tic Tac Tactics</h1><p>Beat the computer. You play X.</p><div class="status" id="status">Your turn!</div><div class="board" id="board"></div><div class="actions"><button id="reset">New Round</button><button id="first">Reset Score</button></div><p id="score">You 0 · Computer 0 · Draws 0</p></main><script>const board=document.querySelector('#board'),status=document.querySelector('#status');let cells=Array(9).fill(''),done=false,score=[0,0,0];const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];function render(){board.innerHTML='';cells.forEach((v,i)=>{let b=document.createElement('button');b.className='cell '+(v==='O'?'o':'');b.textContent=v;b.disabled=!!v||done;b.onclick=()=>play(i);board.append(b)});document.querySelector('#score').textContent='You '+score[0]+' · Computer '+score[1]+' · Draws '+score[2]}function winner(a){for(const w of wins)if(w.every(i=>a[i]===a[w[0]])&&a[w[0]])return a[w[0]];return a.every(Boolean)?'draw':null}function end(){let w=winner(cells);if(w){done=true;if(w==='X'){status.textContent='🎉 You win!';score[0]++}else if(w==='O'){status.textContent='Computer wins!';score[1]++}else{status.textContent='It’s a draw!';score[2]++}render();return true}return false}function play(i){if(done||cells[i])return;cells[i]='X';if(end())return;status.textContent='Computer thinking…';render();setTimeout(()=>{let empty=cells.map((v,i)=>v?null:i).filter(v=>v!==null),choice=-1;for(const mark of ['O','X']){for(const i of empty){let a=cells.slice();a[i]=mark;if(winner(a)===mark){choice=i;break}}if(choice>=0)break}if(choice<0)choice=empty.includes(4)?4:empty[Math.floor(Math.random()*empty.length)];cells[choice]='O';if(!end())status.textContent='Your turn!';render()},350)}function reset(){cells=Array(9).fill('');done=false;status.textContent='Your turn!';render()}document.querySelector('#reset').onclick=reset;document.querySelector('#first').onclick=()=>{score=[0,0,0];reset()};reset();</script></body></html>
